<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Guillaume Ongenae" />
    <title>Guillaume Ongenae</title>
  </head>
  <body>
    <main class="landing-page">
      <div class="emoji-rain" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>

      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" class="command-hidden">
          Guillaume<span>Ongenae</span>
        </h1>
        <p class="intro command-hidden">Grounding. Vibing. Telling.</p>
        <nav class="links command-hidden" aria-label="Personal links">
          <a
            class="link-card"
            href="https://www.linkedin.com/in/guillaumeongenae/"
            target="_blank"
            rel="noreferrer"
          >
            <span>LinkedIn</span>
            <span class="link-icon">↗</span>
          </a>
          <a
            class="link-card"
            href="https://github.com/g-ongenae"
            target="_blank"
            rel="noreferrer"
          >
            <span>GitHub</span>
            <span class="link-icon">↗</span>
          </a>
          <a class="link-card" href="/blog" data-coming-soon="true">
            <span>Blog</span>
            <span class="link-icon">↗</span>
          </a>
        </nav>
      </section>

      <footer class="status-bar command-hidden">
        <span class="status-dot"></span>
        <span>online</span>
        <span class="status-divider">|</span>
        <span>Paris, FR</span>
      </footer>

      <section class="terminal" aria-label="Command history">
        <div class="terminal-history" aria-live="polite"></div>
        <form class="terminal-form">
          <label class="sr-only" for="terminal-input">Enter a command</label>
          <span class="prompt" aria-hidden="true">$</span>
          <input
            id="terminal-input"
            autocomplete="off"
            spellcheck="false"
            aria-label="Terminal command input"
            autofocus
          />
          <span class="cursor" aria-hidden="true"></span>
        </form>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
