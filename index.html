<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030806" />
    <meta name="description" content="Guillaume Ongenae" />
    <title>Guillaume Ongenae</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&display=swap"
    />
  </head>
  <body>
    <main class="landing-page">
      <div class="emoji-rain" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>

      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" class="command-hidden">
          Guillaume<span>Ongenae</span>
        </h1>
        <p class="intro command-hidden">Grounding. Vibing. Telling.</p>
        <nav class="links command-hidden" aria-label="Personal links">
          <a
            class="link-card"
            href="https://www.linkedin.com/in/guillaumeongenae/"
            target="_blank"
            rel="noreferrer"
          >
            <span>LinkedIn</span>
            <svg
              class="link-icon"
              aria-hidden="true"
              viewBox="0 0 12 12"
              width="12"
              height="12"
            >
              <path
                d="M2.5 9.5 9.5 2.5M4 2.5h5.5V8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.25"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
          <a
            class="link-card"
            href="https://github.com/g-ongenae"
            target="_blank"
            rel="noreferrer"
          >
            <span>GitHub</span>
            <svg
              class="link-icon"
              aria-hidden="true"
              viewBox="0 0 12 12"
              width="12"
              height="12"
            >
              <path
                d="M2.5 9.5 9.5 2.5M4 2.5h5.5V8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.25"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
          <a
            class="link-card is-coming-soon"
            href="/blog"
            data-coming-soon="true"
            aria-disabled="true"
            aria-label="Blog — coming soon"
          >
            <span>Blog</span>
            <span class="link-tag">soon</span>
          </a>
        </nav>
      </section>

      <div class="bottom-bar">
        <section class="terminal" aria-label="Command history">
          <div class="terminal-history" aria-live="polite"></div>
          <form class="terminal-form">
            <label class="sr-only" for="terminal-input">Enter a command</label>
            <span class="prompt" aria-hidden="true">$</span>
            <input
              id="terminal-input"
              autocomplete="off"
              spellcheck="false"
              aria-label="Terminal command input"
              autofocus
            />
            <span class="cursor" aria-hidden="true"></span>
          </form>
        </section>

        <footer class="status-bar">
          <span class="status-online command-hidden">
            <span class="status-dot"></span>
            <span>online</span>
          </span>
          <span class="status-location command-hidden">
            <span class="status-divider">|</span>
            <span>Paris, FR</span>
          </span>
        </footer>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
